# ==============================================================================
# Pi-Cordis 配置文件 (cordis.yml / profiles.yml)
# 支持在项目根目录、.pi/cordis.yml 或 ~/.pi/cordis.yml 中自定义 Profile 与插件参数
# ==============================================================================

profiles:
  # 1. 默认日常开发模式
  default:
    description: "标准日常开发模式 (规则自动注入 + 待办任务追踪)"
    plugins:
      rules-injector: true
      todo-tracker: true

  # 2. 安全生产防护模式
  safe:
    description: "安全生产工程模式 (高危命令拦截 + 保护文件防篡改 + Git 自动检查点)"
    plugins:
      safety-gate:
        protectedPaths:
          - .env
          - .env.local
          - .git/
          - id_rsa
          - node_modules/
      git-guard:
        autoCheckpoint: true
        warnDirtyOnStart: true
      rules-injector: true
      todo-tracker: true

  # 3. 严格审计与受限只读模式
  strict:
    description: "严格审计模式 (只读代码审查 + 阻断全部修改与高危操作)"
    plugins:
      safety-gate:
        readOnly: true
        strict: true
      git-guard: true
      rules-injector: true

  # 4. 全能极客模式
  full:
    description: "全能极客模式 (激活全部 4 大原生 Cordis 插件能力)"
    plugins:
      safety-gate: true
      git-guard: true
      todo-tracker: true
      rules-injector: true

  # 5. 极简微内核基线
  minimal:
    description: "零额外插件纯净模式 (仅保留 10 大核心服务)"
    plugins: {}
