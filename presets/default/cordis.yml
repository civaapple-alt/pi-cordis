# ==========================================
# Default Profile Cordis Plugins Composition (Default is Best)
# ==========================================
- name: '@pi-cordis/plugin-safety-gate'
- name: '@pi-cordis/plugin-git-guard'
- name: '@pi-cordis/plugin-rules-injector'
  config:
    scanClaudeRules: true
- name: '@pi-cordis/plugin-todo-tracker'
  config:
    injectToPrompt: true
- name: '@pi-cordis/plugin-output-truncator'
  config:
    maxBytes: 51200
    enableSpill: true
- name: '@pi-cordis/plugin-ask-question'
- name: '@pi-cordis/plugin-btw'
- name: '@pi-cordis/plugin-terminal-notifier'
